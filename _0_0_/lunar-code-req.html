<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #111 0%, #050505 70%);
        font-family: "Courier New", monospace;
        color: #aaa;
        overflow: hidden;
    }

    .container {
        text-align: center;
        transition: opacity 0.6s ease;
    }

    input {
        background: transparent;
        border: none;
        border-bottom: 1px solid #444;
        color: #ddd;
        font-size: 20px;
        padding: 10px;
        width: 220px;
        text-align: center;
        outline: none;
        transition: 0.3s ease;
    }

    input::placeholder {
        color: #555;
        letter-spacing: 2px;
    }

    input:focus {
        border-bottom: 1px solid #888;
    }

    .video-box {
        display: none;
        opacity: 0;
        transition: opacity 1s ease;
    }

    video {
        width: 60vw;
        max-width: 1080px;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(255,255,255,0.05);
    }

    .glow {
        animation: glow 1s ease;
    }

    @keyframes glow {
        0% { border-bottom-color: #0ff; }
        50% { border-bottom-color: #fff; }
        100% { border-bottom-color: #444; }
    }
</style>
</head>

<body>

<div class="container" id="inputContainer">
    <input type="text" id="codeInput" placeholder="Enter code">
</div>

<div class="video-box" id="videoBox">
    <video autoplay muted loop playsinline>
        <source src="Klocha-42.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<script>
    const correctCode = "03255670773838042";
    const input = document.getElementById("codeInput");
    const container = document.getElementById("inputContainer");
    const videoBox = document.getElementById("videoBox");

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            if (input.value === correctCode) {
                container.style.opacity = "0";
                setTimeout(() => {
                    container.style.display = "none";
                    videoBox.style.display = "block";
                    setTimeout(() => {
                        videoBox.style.opacity = "1";
                    }, 50);
                }, 600);
            } else {
                input.classList.add("glow");
                setTimeout(() => {
                    input.classList.remove("glow");
                }, 1000);
                input.value = "";
            }
        }
    });
</script>

</body>
</html>
